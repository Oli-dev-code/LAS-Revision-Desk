<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAS Revision Desk</title>
  <style>
    :root{--ink:#203c43;--muted:#6c7e81;--line:#dce8e5;--paper:#f4f8f6;--teal:#176f6b;--teal-soft:#dcefe9;--amber:#d9973e}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:'Segoe UI',Arial,sans-serif;display:grid;place-items:center;height:100vh;overflow:hidden}
    .window{width:330px;padding:25px 28px 23px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 16px 36px rgba(32,60,67,.12)}
    .brand{display:flex;align-items:center;gap:11px;margin-bottom:23px}
    .brand img{width:42px;height:42px;object-fit:cover;border-radius:8px}
    .brand-name{font-size:12px;font-weight:700;letter-spacing:.2px}
    .brand-subtitle{display:block;margin-top:3px;color:var(--muted);font-size:10px}
    .eyebrow{margin:0 0 7px;color:var(--teal);font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
    h1{margin:0;font-size:18px;line-height:1.25;font-weight:600}
    .detail{margin:7px 0 15px;color:var(--muted);font-size:11px;line-height:1.45}
    .progress-track{height:6px;background:#e8f0ee;border-radius:99px;overflow:hidden}
    .progress-track span{display:block;width:0;height:100%;background:var(--teal);border-radius:99px;transition:width .2s ease}
    .progress-track.indeterminate span{width:35%;animation:progress 1.4s ease-in-out infinite}
    .download-meta{display:flex;justify-content:space-between;margin-top:8px;color:var(--muted);font-size:10px}
    .footer{display:flex;align-items:center;justify-content:space-between;margin-top:13px;color:#8a9b9c;font-size:9px}
    .error .progress-track{background:#f7e5e1}.error .progress-track span{background:#c96d5d}.error .secure i{background:#c96d5d}
    .secure{display:flex;align-items:center;gap:5px}
    .secure i{width:6px;height:6px;border-radius:50%;background:#61ae8d}
    .ready-actions{display:flex;gap:8px;margin-top:16px}
    .ready-actions[hidden]{display:none}
    .ready-actions a{flex:1;padding:9px 8px;border-radius:5px;text-align:center;text-decoration:none;font-size:10px;font-weight:700}
    .restart-action{background:var(--teal);color:#fff}
    .later-action{border:1px solid var(--line);color:var(--teal)}
    @keyframes progress{0%{transform:translateX(-120%)}100%{transform:translateX(330%)}}
  </style>
</head>
<body>
  <main class="window" aria-live="polite">
    <div class="brand"><img src="assets/las-logo-icon.png" alt=""><div><span class="brand-name">LAS Revision Desk</span><span class="brand-subtitle">Learning workspace</span></div></div>
    <p class="eyebrow">Getting things ready</p>
    <h1 class="status">Checking for updates...</h1>
    <p class="detail">Please wait a moment.</p>
    <div class="progress-track indeterminate" aria-label="Update download progress"><span></span></div>
    <div class="download-meta"><span class="progress-label">Preparing...</span><span class="download-stats"></span></div>
    <div class="ready-actions" hidden><a class="restart-action" href="las-revision://restart">Restart and install</a><a class="later-action" href="las-revision://later">Later</a></div>
    <div class="footer"><span>Starting securely</span><span class="secure"><i></i> Connected</span></div>
  </main>
</body>
</html>
